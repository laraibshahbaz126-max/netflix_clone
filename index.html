<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="main">
        <nav>
            <span>
                <img src="./assets/images/logo.svg" alt="Netflix Logo">
            </span>
            <div>
                <button class="btn btn-red-sm">Sign In</button>
            </div>
        </nav>
        <div class="box"></div>
        <div class="hero">
            <span class="firstchild">More watching. Less</span>
            <span class="secondchild"> scrolling.</span>
            <span class="thirdchild"> Starts at Rs 250. Cancel anytime.</span>
            <span class="fourthchild">Ready to watch? Enter your email to create or restart your membership.</span>
            <div>
                <input type="text" placeholder="Email address">
                <button class="btn btn-red">Get Started </button>
            </div>
        </div>
        <div class="sepration"> 
        </div>
        <h2> Trending Now</h2>
        <div class="trending">
            <button class="arrow">side</button>
            <div class="card">
                <div class="rank"> 1</div>
                <img src="./assets/images/image_11.webp" alt=" 1">
            </div>
            <div class="card">
                <div class="rank"> 2</div>
                <img src="./assets/images/image_12.webp" alt="">
            </div>
            <div class="card">
                <div class="rank"> 3</div>
                <img src="./assets/images/image_14.webp" alt="">
            </div>
            <div class="card">
                <div class="rank"> 4</div>
                <img src="./assets/images/image_15.webp" alt="">
            </div>
            <div class="card">
                <!-- <div class="rank"> 5</div> -->
                <img src="./assets/images/image_13.webp" alt="">
            </div>
    </div>
</body>

</html>
